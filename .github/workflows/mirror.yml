name: Mirror Vol2Vol Feed

# Auto-sync the Gold (GC/OG) option-chain feed from the upstream publisher
# into THIS (public) mirror repo, so the SD Visualizer keeps working even if
# the original ever goes private/offline. Commits only when the data changes.

on:
  schedule:
    - cron: '*/10 * * * *'   # ทุก ~10 นาที (GitHub schedule = best-effort อาจดีเลย์บ้าง)
  workflow_dispatch:          # กด Run เองได้

permissions:
  contents: write

concurrency:
  group: mirror-feed
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest feed from origin
        run: |
          set -e
          BASE="https://raw.githubusercontent.com/pageth/Vol2VolData/main"
          for f in IntradayData.txt OIData.txt; do
            # cache-bust + retry กัน CDN ค้าง
            if curl -fsSL --retry 3 --retry-delay 2 "$BASE/$f?cb=$(date +%s)" -o "$f.new"; then
              mv "$f.new" "$f"
              echo "fetched $f ($(wc -l < "$f") lines)"
            else
              echo "::warning::fetch failed for $f — keeping previous copy"
              rm -f "$f.new"
            fi
          done

      - name: Commit if changed
        run: |
          git config user.name  "feed-mirror-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add IntradayData.txt OIData.txt
          if git diff --cached --quiet; then
            echo "no change — skip commit"
            exit 0
          fi
          git commit -m "mirror: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push
